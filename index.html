<!doctype html><html lang="ko"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>설날 친구비 정산서</title><meta name="theme-color" content="#111111"/>
<link rel="icon" type="image/png" sizes="32x32" href="https://jdhclimb.github.io/ClimbingAddict/assets/hold.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="https://jdhclimb.github.io/ClimbingAddict/assets/hold.png"/>
<meta property="og:type" content="website"/><meta property="og:title" content="설날 친구비 정산서"/>
<meta property="og:url" content="https://jdhclimb.github.io/friend_fee/"/>
<meta property="og:image" content="https://jdhclimb.github.io/friend_fee/web.png"/><meta property="og:image:width" content="1200"/>

<meta property="og:image:height" content="630"/><meta property="og:image:type" content="image/png"/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-W6HJD3GBPH"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-W6HJD3GBPH');</script>
<link rel="stylesheet" href="style.css"/>
</head><body>
<main class="app">
<header class="header"><div class="badge">🧗‍♂️ @jdh._.climb</div><h1>설날 친구비 정산서</h1></header>

<section id="screenStart" class="screen">
<div class="card">
<div class="hero-center">
<div class="hero-image half"><img src="https://jdhclimb.github.io/friend_fee/main.png" alt="메인 이미지"/></div>
<p class="hero-desc">받으면 반띵</p>
<div class="name-box">
<div class="field floating"><input type="text" id="myName" maxlength="6" placeholder=" " required/><label for="myName">내 이름 / 닉네임은?</label></div>
<div class="field floating"><input type="text" id="friendName" maxlength="6" placeholder=" " required/><label for="friendName">상대 이름 / 닉네임은?</label></div>
</div>
<button id="btnStart" class="btn primary" type="button">테스트 시작 🧗</button>
</div>
</div>
<b id="qTotal" style="display:none">0</b>
</section>

<section id="screenQuiz" class="screen hidden">
<div class="topbar">
<div class="progress-wrap">
<div class="progress"><div id="progressBar" class="progress-bar"></div></div>
<div class="progress-text" aria-live="polite"><span id="qIndex">1</span>/<span id="qTotal2">0</span></div>
</div>
<button id="btnResetTop" class="btn ghost" type="button" title="처음부터">다시 하기</button>
</div>
<div class="card">
<h2 id="qTitle" class="q-title">Q1. ...</h2>
<div id="options" class="options"></div>
<div class="nav">
<button id="btnPrev" class="btn" type="button" disabled>← 이전</button>
<button id="btnNext" class="btn primary" type="button" disabled>다음 →</button>
</div>
</div>
<p class="hint">※ 구라치다 걸리면 친구비고 뭐고 손모가지 날아가는 겨</p>
</section>

<section id="screenResult" class="screen hidden">
<div class="card result-card simple-result" id="resultCard">
<p id="resultLine" class="result-line"></p>
<div class="money-box"><span class="money-label">총 금액</span><span id="resultMoney" class="money-value">₩0</span></div>
<div class="nav result-nav no-export">
<button id="btnRestart" class="btn" type="button">다시 하기</button>
<button id="btnShareLink" class="btn" type="button">결과 공유</button>
<button id="btnSaveCard" class="btn primary" type="button">카드 저장</button>
</div>
<footer class="footer"><small>🍀나도 좀 나눠줘라🍀</small></footer>
</div>
</section>

<div id="exportMount" aria-hidden="true"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="app.js?v=4"></script>
</body></html>
